# Чем занимается Павел — с живого сайта https://pavelklyushin.ru
# Оценщик смотрит на это, когда решает, отдавать заявку или нет.

site: https://pavelklyushin.ru
who: |
  Павел Клюшин, ИИ-специалист, самозанятый, Санкт-Петербург.
  На сайте три услуги, плюс то, что Павел назвал отдельно: сайты, файнтюнинг,
  боты и ассистенты, интеграции и 1С, база знаний, разбор документов,
  карточки Wildberries/Ozon, продвижение Дзена и статейных сервисов.
  Берёт разбор в Telegram, потом план, MVP, запуск и сопровождение.
  Кейс: контент-конвейер каталога автокомпонентов и аккумуляторов (без публичного URL магазина).

services:
  - id: agents
    title: Агентские системы
    url: https://pavelklyushin.ru/agentnye-sistemy/
    do: |
      ИИ-агент с действием в учёте: заявка → CRM/таблица → статус, счёт, эскалация человеку.
      Не простой чат-бот с кнопками.
    offer: пилот агентской системы: заявка в мессенджере → действие в CRM, спорное человеку
  - id: n8n
    title: Автоматизация процессов
    url: https://pavelklyushin.ru/avtomatizaciya-processov/
    do: |
      Связка Telegram/WhatsApp, CRM, почты, таблиц и вебхуков на n8n или Make.
      Чтобы заявки не терялись и никто не копировал руками.
    offer: сценарий на n8n: мессенджер → CRM → уведомление, без ручного переноса
  - id: catalog
    title: Каталог и магазин
    url: https://pavelklyushin.ru/katalog-i-magazin/
    do: |
      Контент-конвейер карточек: характеристики, SEO-описания, выгрузка на сайт.
      Свой канал продаж, живой каталог, при необходимости сайт или магазин.
    offer: контент-конвейер карточек, как в кейсе аккумуляторов
  - id: sites
    title: Разработка сайтов
    do: |
      Корпоративный сайт, лендинг, сервис или интернет-магазин под ключ.
      Не вёрстка «баннера на вечер» и не правка чужой Тильды без задачи.
    offer: сайт или магазин под задачу: структура, запуск, при необходимости ИИ-модуль
  - id: finetune
    title: Дообучение модели
    do: |
      Файнтюнинг: взять готовую модель и доучить её на примерах клиента,
      чтобы она говорила его языком и знала его продукт. Это не курс «как пользоваться ChatGPT».
    offer: дообучение модели на ваших примерах, чтобы ответы были про ваш продукт
  - id: bots
    title: Боты и ИИ-ассистенты
    do: |
      Telegram, WhatsApp, VK и другие боты. ИИ-ассистент, который отвечает
      и передаёт заявку дальше, а не только меню из кнопок.
    offer: бот или ИИ-ассистент под задачу: ответы клиентам и передача заявки в учёт
  - id: integrations
    title: Связки и интеграции
    do: |
      Связка приложений между собой: CRM, мессенджеры, почта, таблицы, 1С.
      Для России 1С — такая же связка, как n8n и Make.
    offer: связка ваших приложений, включая 1С, без ручного переноса
  - id: knowledge
    title: База знаний компании
    do: |
      Ответы по регламентам, переписке и документам, со ссылкой на источник.
    offer: база знаний: ответ по вашим документам со ссылкой на источник
  - id: documents
    title: Разбор документов
    do: |
      Договоры, счета, акты и заявки разбираются в поля CRM или 1С.
    offer: разбор договора, счёта или акта в поля CRM или 1С
  - id: marketplace
    title: Карточки Wildberries и Ozon
    do: |
      Карточки для маркетплейсов. Продолжение кейса с каталогом:
      так люди ищут чаще, чем «контент-конвейер».
    offer: карточки для Wildberries или Ozon, как в кейсе каталога
  - id: dzen
    title: Продвижение Дзена и статей
    do: |
      Дзен и похожие статейные сервисы: статьи, которые приводят людей.
    offer: статьи и продвижение в Дзене или похожем сервисе

good_lead: |
  Платный заказ на бота, ассистента, агента, n8n/Make, связку приложений или 1С,
  базу знаний со ссылкой на источник, разбор документов в CRM,
  сайт, каталог, карточки Wildberries/Ozon, Дзен, дообучение модели.
  Собственник или руководитель, повторяющийся процесс.

high_ticket_signals:
  - интернет-магазин
  - каталог
  - карточки товаров
  - агентск
  - внедрение под ключ
  - crm
  - n8n
  - make
  - сопровождение
  - владельцу бизнеса
  - автоматизация заказов
  - сайт
  - лендинг
  - файнтюнинг
  - дообучение модели
  - 1с
  - база знаний
  - wildberries
  - ozon
  - дзен
  - бот
  - ассистент

reject_signals:
  - бесплатно «для портфолио»
  - курс / обучение / наставничество как продукт
  - штатная вакансия без проекта
  - крипта, казино, эскорт
  - «напиши один текст нейросетью» без системы, сайта или Дзена
  - голосовой робот / речевая аналитика как продукт
  - парсинг чужих сайтов как услуга
  - полная замена отдела без человека
  - реклама чужого сервиса и спам
  - один и тот же текст второй раз
  - разовый дизайнер карточки, инфографика, пара слайдов
  - курьеры, SMM, монтаж, продажи, «нейросети сделают работу за тебя»
  - риелтор, агент по продажам, «опыт не нужен»
  - курс «заработал на чат-боте» и реклама канала с вакансиями
  - живой сотрудник, который руками принимает заявки из CRM
