# Чем занимается Павел — с сайта https://pavelklyushin.ru/
# Оценщик смотрит на это, когда решает, отдавать заявку или нет.

site: https://pavelklyushin.ru/
contact_telegram: "@pasha_kvk"
content_channel: "@paxa_terminator"
min_budget_rub: 5000
who: |
  Павел Клюшин, технический партнёр для бизнеса. Практикующий инженер,
  самозанятый, Санкт-Петербург и удалённо по России. Работает один: всегда «я»,
  без «мы с командой». База — веб, архитектура и SEO, сверху актуальные инструменты.
  Не выходит с ярлыка «ИИ-специалист».
  Направления: сайты и живые каталоги, автоматизация и связка сервисов
  (n8n, Make, API, Telegram, CRM, Битрикс24, 1С, Google Таблицы, МойСклад),
  умные сценарии, где человек подтверждает результат.
  Берёт разбор в Telegram, потом план и смету, майнд-карту и MVP, запуск и поддержку.
  Кейс, который можно называть: интернет-магазин аккумуляторов — архитектура каталога,
  карточки и синхронизация. Без названия магазина и без ссылки на витрину.
positioning: |
  Технический партнёр для бизнеса, руки инженера. Сначала задача клиента,
  потом инструменты. Контакт для заявки — Telegram @pasha_kvk.
  Канал с материалами — @paxa_terminator. Сайт — https://pavelklyushin.ru/

services:
  - id: agents
    title: Агентские системы
    url: https://pavelklyushin.ru/agentnye-sistemy/
    do: |
      ИИ-агент с действием в учёте: заявка → CRM/таблица → статус, счёт, эскалация человеку.
      Не простой чат-бот с кнопками.
    offer: "пилот агентской системы: заявка в мессенджере → действие в CRM, спорное человеку"
  - id: n8n
    title: Автоматизация процессов
    url: https://pavelklyushin.ru/avtomatizaciya-processov/
    do: |
      Связка Telegram/WhatsApp, CRM, почты, таблиц и вебхуков на n8n или Make.
      Чтобы заявки не терялись и никто не копировал руками.
    offer: "сценарий на n8n: мессенджер → CRM → уведомление, без ручного переноса"
  - id: catalog
    title: Каталог и магазин
    url: https://pavelklyushin.ru/katalog-i-magazin/
    do: |
      Контент-конвейер карточек: характеристики, SEO-описания, выгрузка на сайт.
      Свой канал продаж, живой каталог, при необходимости сайт или магазин.
    offer: "контент-конвейер карточек, как в кейсе аккумуляторов"
  - id: sites
    title: Разработка сайтов
    do: |
      Корпоративный сайт, лендинг, сервис или интернет-магазин под ключ.
      Не вёрстка «баннера на вечер» и не правка чужой Тильды без задачи.
    offer: "сайт или магазин под задачу: структура, запуск, при необходимости ИИ-модуль"
  - id: finetune
    title: Дообучение модели
    do: |
      Файнтюнинг: взять готовую модель и доучить её на примерах клиента,
      чтобы она говорила его языком и знала его продукт. Это не курс «как пользоваться ChatGPT».
    offer: "дообучение модели на ваших примерах, чтобы ответы были про ваш продукт"
  - id: bots
    title: Боты и ИИ-ассистенты
    do: |
      Telegram, WhatsApp, VK и другие боты. ИИ-ассистент, который отвечает
      и передаёт заявку дальше, а не только меню из кнопок.
    offer: "бот или ИИ-ассистент под задачу: ответы клиентам и передача заявки в учёт"
  - id: integrations
    title: Связки и интеграции
    do: |
      Связка приложений между собой: CRM, Битрикс24, МойСклад, мессенджеры, почта, таблицы, 1С.
      Для России 1С — такая же связка, как n8n и Make.
    offer: "связка ваших приложений, включая 1С и Битрикс24, без ручного переноса"
  - id: knowledge
    title: База знаний компании
    do: |
      Ответы по регламентам, переписке и документам, со ссылкой на источник.
    offer: "база знаний: ответ по вашим документам со ссылкой на источник"
  - id: documents
    title: Разбор документов
    do: |
      Договоры, счета, акты и заявки разбираются в поля CRM или 1С.
    offer: "разбор договора, счёта или акта в поля CRM или 1С"
  - id: marketplace
    title: Карточки Wildberries и Ozon
    do: |
      Карточки для маркетплейсов. Продолжение кейса с каталогом:
      так люди ищут чаще, чем «контент-конвейер».
    offer: "карточки для Wildberries или Ozon, как в кейсе каталога"
  - id: dzen
    title: Дзен и контент-система
    do: |
      Статьи и автопостинг как система: план, проверка, публикация.
      Голый SMM, копирайт и рилс сюда не входят.
    offer: "система статей и автопостинга в Дзене"
  - id: smm
    title: SMM с командой
    do: |
      Ведение и продвижение соцсетей с командой: Instagram, Telegram, ВК, YouTube, TikTok,
      Reels и сторис, упаковка профиля, контент-план, таргет ВК, съёмки.
      Берём от 40 000 ₽ в месяц. Кейсы — канал команды https://t.me/+Y8YwrVN7JLkwYzVi
      и docs/cases/smm_cases.md. Не берём разовый копирайт и работу бесплатно.
    offer: "ведение и продвижение соцсетей с командой, от 40 000 ₽"

smm:
  # Ниже этого — мусор, в ленту не попадает.
  min_budget_rub: 10000
  # От этого — балл 4. Между порогами — балл 2 (ниже правила 40 000 ₽). Без бюджета — балл 3.
  take_budget_rub: 40000
  take_when: |
    Заказчик ищет ведение, продвижение, упаковку, Reels, сторис, контент-план или таргет,
    бюджет от 40 000 ₽ или не назван.
  reject_when: |
    Бюджет ниже 10 000 ₽, работа бесплатно, за отзыв, портфолио или бартер,
    реклама других SMM-щиков, разовый копирайт.

not_fit:
  - копеечные разовые правки, «подвинуть кнопку»
  - запрос «волшебной кнопки»
  - длинные тендеры
  - отзывы и кейсы исполнителей
  - визитки и самореклама других фрилансеров
  - карточки услуг на биржах, где продают услугу, а не ищут заказ
  - найм в штат
  - SMM дешевле 10 000 ₽, бесплатно, за отзыв или бартер

good_lead: |
  Платный заказ на бота, ассистента, агента, n8n/Make, связку приложений, 1С или Битрикс24,
  базу знаний со ссылкой на источник, разбор документов в CRM,
  сайт, каталог, карточки Wildberries/Ozon, Дзен, дообучение модели.
  SMM с командой: ведение, продвижение, упаковка, таргет; от 40 000 ₽ — балл 4, без бюджета — 3.
  Собственник или руководитель, повторяющийся процесс.

high_ticket_signals:
  - интернет-магазин
  - каталог
  - карточки товаров
  - агентск
  - внедрение под ключ
  - crm
  - n8n
  - make
  - сопровождение
  - владельцу бизнеса
  - автоматизация заказов
  - сайт
  - лендинг
  - файнтюнинг
  - дообучение модели
  - 1с
  - битрикс
  - мойсклад
  - база знаний
  - wildberries
  - ozon
  - дзен
  - бот
  - ассистент

reject_signals:
  - бесплатно «для портфолио»
  - курс / обучение / наставничество как продукт
  - штатная вакансия без проекта
  - крипта, казино, эскорт
  - «напиши один текст нейросетью» без системы, сайта или Дзена
  - голосовой робот / речевая аналитика как продукт
  - парсинг чужих сайтов как услуга
  - полная замена отдела без человека
  - реклама чужого сервиса и спам
  - один и тот же текст второй раз
  - разовый дизайнер карточки, инфографика, пара слайдов
  - курьеры, монтаж, продажи, «нейросети сделают работу за тебя»
  - SMM дешевле 10 000 ₽, бесплатно, за отзыв или бартер, реклама других SMM-щиков
  - риелтор, агент по продажам, «опыт не нужен»
  - курс «заработал на чат-боте» и реклама канала с вакансиями
  - живой сотрудник, который руками принимает заявки
  - отзыв, кейс или визитка исполнителя
  - карточка услуги на бирже («сделаю», «от N ₽ за»)
  - разовая правка, «подвинуть кнопку», «волшебная кнопка»
  - тендер, 44-ФЗ, 223-ФЗ
  - найм в штат, оклад, «в команду» без проектного подряда из CRM

# Отклики из командной строки: python -m app.outreach (решение Павла 2026-10-19).
# Telegram: личка автору, если есть контакт, иначе ответ в треде чата.
outreach:
  mode: auto            # auto | dm | thread
  min_interval_sec: 90  # пауза между отправками
  max_per_hour: 12
  max_per_day: 40
  author_cooldown_days: 7  # одному контакту не чаще
  min_fit: 3            # list-new по умолчанию

# Kwork: берём заказ, только если предложений меньше этого порога (решение Павла 2026-10-13).
kwork:
  max_offers: 9
